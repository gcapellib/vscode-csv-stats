name: CI

# Rien n'exécutait npm test automatiquement avant ce fichier : une version
# cassée pouvait être taguée et déposée sur le Marketplace sans que rien ne
# le signale. Ce workflow tourne sur chaque push et chaque pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Vérification des types
        run: npm run typecheck

      - name: Style et qualité
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Construction du paquet
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium

      - name: Tests d'intégration (Playwright, sur le bundle réel)
        run: npm run test:integration
